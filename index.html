<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founders Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 22V10l14 12V10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">N</div>
      <div><div class="brand-name" id="brand-name">Founders Hub</div><div class="brand-sub">Internal tracker</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <label class="lbl" for="me">Acting as</label>
      <select id="me" class="sel"></select>
      <div class="sync" id="sync"></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="page-title">Dashboard</h1>
      <div class="top-actions" id="actions"></div>
      <button class="icon-btn" id="theme" title="Toggle light / dark" aria-label="Toggle theme"></button>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<dialog id="modal"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="imp" accept="application/json" hidden>
<script src="vendor/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
